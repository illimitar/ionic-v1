<!DOCTYPE html>
<html ng-app="modernDemo">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="initial-scale=1, maximum-scale=1, user-scalable=no, width=device-width">
  <title>Ionic v1 modern theme</title>
  <link href="../../../release/css/ionic.css" rel="stylesheet">
  <style>
    .modern-demo { width: 100%; max-width: 760px; margin: 0 auto; padding: 60px 12px 88px; box-sizing: border-box; }
    .modern-demo-section { margin: 20px 0 8px; color: #65748b; font-size: 12px; font-weight: 700; text-transform: uppercase; }
    .modern-demo-actions { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
    .modern-demo .card { margin: 12px 0; }
  </style>
</head>
<body ng-controller="ModernDemoController">
  <div class="bar bar-header bar-positive">
    <button class="button button-icon ion-navicon"></button>
    <h1 class="title">Ionic 1.3.23</h1>
    <button class="button button-icon ion-more"></button>
  </div>

  <div class="has-header modern-demo">
    <div class="modern-demo-section">Formulario</div>
    <div class="list list-inset">
      <label class="item item-input item-stacked-label">
        <span class="input-label">Usuario</span>
        <input type="text" placeholder="Digite seu usuario">
      </label>
      <label class="item item-input item-select">
        <span class="input-label">Entidade</span>
        <select ng-model="entity" ng-options="entity.id as entity.name group by entity.group for entity in entities">
          <option value="">Nenhuma</option>
        </select>
      </label>
      <ion-toggle class="item item-toggle">
        Atualizar automaticamente
        <label class="toggle toggle-positive"><input type="checkbox" checked><div class="track"><div class="handle"></div></div></label>
      </ion-toggle>
    </div>

    <div class="modern-demo-section">Acoes</div>
    <div class="modern-demo-actions">
      <button class="button button-positive">Confirmar</button>
      <button class="button button-outline button-positive">Voltar</button>
      <button class="button button-balanced">Concluir</button>
      <button class="button button-assertive" disabled>Excluir</button>
    </div>

    <div class="modern-demo-section">Lista</div>
    <div class="list card">
      <div class="item item-divider">Modulos recentes</div>
      <a class="item item-icon-left item-icon-right" href="#">
        <i class="icon ion-cube positive"></i>
        Separar pedido
        <p>Operacao disponivel</p>
        <i class="icon ion-chevron-right icon-accessory"></i>
      </a>
      <a class="item item-icon-left item-icon-right activated" href="#">
        <i class="icon ion-printer positive"></i>
        Cadastrar impressora
        <p>Item selecionado</p>
        <i class="icon ion-chevron-right icon-accessory"></i>
      </a>
    </div>

    <div class="modern-demo-section">Controles</div>
    <div class="list list-inset">
      <label class="item item-checkbox">
        <label class="checkbox checkbox-positive"><input type="checkbox" checked></label>
        Selecionado
      </label>
      <div class="item">Status <span class="badge badge-balanced">Ativo</span></div>
    </div>

    <div class="modern-demo-section">Overlays</div>
    <div class="modern-demo-actions">
      <button class="button button-stable" ng-click="showPopup()">Popup</button>
      <button class="button button-stable" ng-click="showLoading()">Loading</button>
      <button class="button button-stable" ng-click="showActionSheet()">Action sheet</button>
      <button class="button button-stable" ng-click="showModal()">Modal</button>
    </div>
  </div>

  <div class="tabs tabs-icon-top">
    <a class="tab-item active"><i class="icon ion-home"></i>Inicio</a>
    <a class="tab-item"><i class="icon ion-cube"></i>Modulos</a>
    <a class="tab-item"><i class="icon ion-gear-a"></i>Ajustes</a>
  </div>

  <script src="../../../release/js/ionic.bundle.js"></script>
  <script>
    angular.module('modernDemo', ['ionic'])
      .controller('ModernDemoController', function ($scope, $ionicActionSheet, $ionicLoading, $ionicModal, $ionicPopup) {
        $scope.entities = [
          { id: 1, name: 'Matriz Illimitar', group: 'Principais' },
          { id: 2, name: 'Centro de distribuicao', group: 'Principais' },
          { id: 3, name: 'Loja homologacao', group: 'Outras entidades' }
        ];
        $scope.entity = 2;
        $scope.showPopup = function () {
          $ionicPopup.show({
            title: 'Confirmar operacao',
            subTitle: 'Revise os dados antes de continuar',
            template: 'A movimentacao sera processada com os valores informados.',
            buttons: [
              { text: 'Cancelar' },
              { text: 'Confirmar', type: 'button-positive' }
            ]
          });
        };

        $scope.showLoading = function () {
          $ionicLoading.show({
            template: '<ion-spinner icon="lines"></ion-spinner><p>Atualizando informacoes...</p>',
            duration: 2500
          });
        };

        $scope.showActionSheet = function () {
          $ionicActionSheet.show({
            titleText: 'Opcoes da sessao',
            buttons: [{ text: 'Atualizar sessao' }, { text: 'Mudar de entidade' }],
            destructiveText: 'Sair',
            cancelText: 'Cancelar'
          });
        };

        var modal = $ionicModal.fromTemplate(
          '<ion-modal-view><ion-header-bar class="bar-positive"><h1 class="title">Detalhes</h1>' +
          '<button class="button button-clear" ng-click="closeModal()">Fechar</button></ion-header-bar>' +
          '<ion-content class="padding has-header"><div class="card"><div class="item item-text-wrap">' +
          '<h2>Movimentacao pronta</h2><p>Conteudo apresentado dentro de um modal responsivo.</p>' +
          '</div></div></ion-content></ion-modal-view>',
          { scope: $scope }
        );

        $scope.showModal = function () { modal.show(); };
        $scope.closeModal = function () { modal.hide(); };
      });
  </script>
</body>
</html>
